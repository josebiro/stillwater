name: Release

# Pushing a tag such as v0.2.0 that points at a commit on main builds the
# Windows installer and publishes it as a GitHub release. Running the workflow
# manually builds the same files and keeps them as a short-lived artifact
# without publishing a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag
        if: github.ref_type == 'tag'
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version. Bump the version, then tag v$version."
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:GITHUB_REF_NAME does not point at a commit on main." }

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: npm ci
      # npm ci does not always fetch the Electron binary; the installer is a no-op when it is present.
      - run: node node_modules/electron/install.js

      - name: Run source checks
        run: |
          foreach ($check in 'check:outline', 'check:meeting-qa', 'check:calendar', 'check:hosted-settings') {
            npm run $check
            if ($LASTEXITCODE -ne 0) { throw "$check failed." }
          }

      - name: Restore the Moonshine model
        uses: actions/cache@v6
        with:
          path: .dev/moonshine-models
          key: moonshine-model-${{ hashFiles('tools/stage-build-deps.ps1', 'tools/package-windows.ps1') }}

      - name: Stage the Python runtime and speech model
        run: ./tools/stage-build-deps.ps1

      - name: Locate NSIS
        run: |
          $compiler = (Get-Command makensis.exe -ErrorAction Ignore).Source
          if (-not $compiler) { $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe' }
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'makensis.exe was not found.' }
          "NSIS_COMPILER=$compiler" >> $env:GITHUB_ENV

      - name: Build the installer
        run: |
          $payload = & ./tools/package-windows.ps1
          & ./tools/build-installer.ps1 -Payload $payload -Compiler $env:NSIS_COMPILER
          # The staged payload is several gigabytes and is not a release file.
          Remove-Item -LiteralPath $payload -Recurse -Force
          # One .sha256 beside each file plus a combined sha256.sum, as in rvl-cli releases.
          Push-Location dist
          $sums = foreach ($name in 'Stillwater-Setup-x64.exe', 'Stillwater-CUDA-x64.zip') {
            $line = '{0}  {1}' -f (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLower(), $name
            Set-Content -LiteralPath "$name.sha256" -Value $line -Encoding ascii
            $line
          }
          Set-Content -LiteralPath sha256.sum -Value $sums -Encoding ascii
          Get-Content sha256.sum
          Pop-Location

      - name: Keep the build as an artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: stillwater-windows-x64
          path: |
            dist/Stillwater-Setup-x64.exe
            dist/Stillwater-CUDA-x64.zip
            dist/*.sha256
            dist/sha256.sum
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $base = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$tag"
          $rows = foreach ($file in @(
              @{ Name = 'Stillwater-Setup-x64.exe'; What = 'Windows x64 installer' },
              @{ Name = 'Stillwater-CUDA-x64.zip'; What = 'CUDA libraries the installer requires' })) {
            '| [{0}]({1}/{0}) | {2} | [checksum]({1}/{0}.sha256) |' -f $file.Name, $base, $file.What
          }
          $notes = @(
            "## Download Stillwater $($tag.TrimStart('v'))"
            ''
            '| File | Contents | Checksum |'
            '|------|----------|----------|'
            $rows
            ''
            'Download both files into the same folder, then run the setup executable. Setup stops if the ZIP is not beside it. The Microsoft Visual C++ v14 Redistributable (x64) must be installed.'
          )
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8
          # A version with a suffix, such as v0.2.0-rc.1, is published as a prerelease.
          $flags = @(if ($tag -match '-') { '--prerelease' })
          gh release create $tag `
            dist/Stillwater-Setup-x64.exe dist/Stillwater-CUDA-x64.zip `
            dist/Stillwater-Setup-x64.exe.sha256 dist/Stillwater-CUDA-x64.zip.sha256 dist/sha256.sum `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Stillwater $tag" `
            --notes-file $notesFile --generate-notes --verify-tag @flags
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }
