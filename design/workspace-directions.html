<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stillwater · Design preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0f;color:#f5f2fa;font:14px/1.45 "Segoe UI Variable","Segoe UI",sans-serif}button,select,input{font:inherit;color:inherit}button,select{cursor:pointer}button{border:0;background:none}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}h1,h2,h3,p{margin:0}button:hover{filter:brightness(1.15)}[hidden]{display:none!important}
body{--bg:#0c0c10;--rail:#101015;--surface:#17171e;--border:#30303b;--ink:#f5f2fa;--muted:#afaaba;--accent:#b4a0ff;--subtle:#242030;--primary:#a58aff;--on-primary:#160f2a;--detail:#83d7bb;--radius:9px;--heading:"Segoe UI Variable Display","Segoe UI",sans-serif;background:var(--bg)}
body[data-theme=folio]{--bg:#110e15;--rail:#110e15;--surface:#211924;--border:#3b303f;--ink:#fff4ed;--muted:#c0b0bc;--accent:#e1a8ee;--subtle:#302332;--primary:#e6bfda;--on-primary:#261725;--detail:#e7b48e;--radius:3px;--heading:Georgia,serif;color:var(--ink)}
.ico{font:16px "Segoe Fluent Icons","Segoe MDL2 Assets";font-style:normal;line-height:1}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:630;letter-spacing:-1px}.mark{width:30px;height:28px;display:grid;align-content:center;gap:3px;transform:skew(-18deg)}.mark i{display:block;height:3px;border-radius:50%;background:var(--accent);width:23px}.mark i:nth-child(2){width:30px}.mark i:last-child{width:18px}
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:calc(100vh - 43px)}aside{background:var(--rail);border-right:1px solid var(--border);padding:31px 18px 22px;display:flex;flex-direction:column;gap:30px}.brand{padding:0 8px}nav{display:grid;gap:4px}.navlink{display:flex;align-items:center;gap:12px;color:var(--muted);text-align:left;padding:10px;border-radius:var(--radius)}.selected{background:var(--subtle);color:var(--accent)}.navfoot{margin-top:auto;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:9px}.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--detail)}main{min-width:0}.top{display:flex;align-items:center;gap:12px;height:64px;padding:0 5.5%;border-bottom:1px solid var(--border);color:var(--muted)}.top strong{color:var(--ink);font-weight:500}.top .actions{margin-left:auto;display:flex;align-items:center;gap:15px}.primary,.small{display:inline-flex;gap:8px;align-items:center;border-radius:var(--radius);padding:8px 14px}.primary{background:var(--primary);color:var(--on-primary);font-weight:650}.small{background:var(--surface);border:1px solid var(--border)}.wrap{padding:32px 5.5% 36px;max-width:1450px;margin:auto}.eyebrow,.label,.time,.date,.caption{font:11px/1.4 Consolas,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}h1,h2,h3{font-family:var(--heading)}h1{font-size:44px;line-height:1.08;letter-spacing:-.055em;font-weight:550;margin:7px 0 23px}h2{font-size:20px;font-weight:580;letter-spacing:-.035em}h3{font-size:30px;line-height:1.14;letter-spacing:-.04em;font-weight:550}.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:var(--radius);padding:24px 28px;background:linear-gradient(105deg,#211b35,#35215b 60%,#271943);border:1px solid #564172;min-height:174px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:11px}.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.hero .eyebrow{color:#dbcdfa}.meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.hero .meta{color:#e0d5ed}.hero h3{max-width:75%}.hero .open{position:absolute;right:18px;bottom:18px;background:#17121d99;border:1px solid #cabbda68;padding:7px 11px;border-radius:var(--radius);color:#fff}.columns{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(235px,1fr);gap:32px;margin-top:31px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.row{width:100%;display:flex;align-items:center;text-align:left;gap:12px;border-top:1px solid var(--border);padding:14px 0}.row:hover{background:var(--surface)}.docicon{width:34px;height:38px;border-radius:var(--radius);background:var(--subtle);color:var(--accent);display:grid;place-items:center}.row strong,.event strong{display:block;font-size:15px;font-weight:570}.row small,.event small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.row .time{margin-left:auto;white-space:nowrap}.event{display:flex;align-items:center;gap:13px;border-top:1px solid var(--border);padding:15px 0;width:100%;text-align:left}.event .time{min-width:64px;color:var(--accent)}.ask{width:100%;margin-top:26px;padding:13px 17px;display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--muted)}.ask span:last-child{margin-left:auto}.preview{display:flex;align-items:center;justify-content:center;gap:12px;min-height:43px;background:#202025;border-top:1px solid #393941;color:#d1cfd5;font:12px "Segoe UI",sans-serif}.preview select{border:1px solid #5b5963;border-radius:5px;background:#29282e;padding:3px 7px}.preview span{color:#aaa7b0}
.folio-only{display:none}body[data-theme=folio] .signal-only{display:none}body[data-theme=folio] .folio-only{display:block}body[data-theme=folio] .shell{display:block}body[data-theme=folio] aside{height:68px;padding:0 6%;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--border);gap:50px}body[data-theme=folio] aside nav{display:flex;gap:9px}body[data-theme=folio] .brand{font:italic 27px Georgia,serif;padding:0}body[data-theme=folio] .navfoot{margin:0 0 0 auto}body[data-theme=folio] .top{display:none}body[data-theme=folio] .wrap{padding:32px 6% 38px}body[data-theme=folio] .mast{display:flex;justify-content:space-between;align-items:center}body[data-theme=folio] h1{font:normal clamp(48px,5.7vw,87px)/1 var(--heading);letter-spacing:-.07em;margin:10px 0 26px}body[data-theme=folio] h2{font:normal 26px var(--heading)}body[data-theme=folio] h3{font:normal clamp(30px,3.4vw,55px)/1.03 var(--heading);letter-spacing:-.055em}body[data-theme=folio] .hero{min-height:212px;background:linear-gradient(112deg,#27172f 13%,#4f235d 58%,#9a5d7c);border:0;padding:27px 32px}body[data-theme=folio] .columns{grid-template-columns:minmax(215px,.8fr) minmax(0,1.65fr);gap:5.5%;margin-top:25px}body[data-theme=folio] .library{grid-column:2;grid-row:1}body[data-theme=folio] .schedule{grid-column:1;grid-row:1}body[data-theme=folio] .docicon{background:transparent;border:1px solid var(--border)}body[data-theme=folio] .row{padding:11px 0}body[data-theme=folio] .row strong{font:21px var(--heading)}body[data-theme=folio] .ask{margin-top:15px;background:transparent;border-inline:0;border-bottom:0}
.paper{max-width:790px;margin:8px auto}.paper h1{margin-bottom:12px}.paper header{padding:20px 0 27px;border-bottom:1px solid var(--border)}.paper article{padding:22px 0;font-size:16px;line-height:1.75}.paper article h2{margin:8px 0}.paper li{margin-bottom:9px}.cite{color:var(--accent);font:11px Consolas,monospace;background:var(--subtle);padding:2px 4px;border-radius:3px}.dock{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 18px;color:var(--muted)}.dock .small{margin-left:auto}.panel{margin:0 0 12px;padding:18px;background:var(--subtle);border-radius:var(--radius);line-height:1.7}.panel .time{margin-right:10px}
@media(max-width:850px){.shell{grid-template-columns:158px minmax(0,1fr)}aside{padding-inline:10px}.columns{gap:15px;grid-template-columns:1.3fr 1fr}.row .time{display:none}body[data-theme=folio] aside{gap:20px}}@media(max-width:680px){.shell{display:block}aside,body[data-theme=folio] aside{height:auto;flex-direction:row;align-items:center;padding:12px;gap:12px;border:0}.navfoot,.navlink:nth-child(3),.top{display:none}aside nav{display:flex}.columns,body[data-theme=folio] .columns{display:flex;flex-direction:column}.hero .open{position:static}.wrap{padding:18px}.hero h3{max-width:100%}.preview{flex-wrap:wrap;padding:6px}.navlink{padding:6px}.brand{font-size:17px}}
</style></head><body>
<div class="shell"><aside><div class="brand"><span aria-hidden="true" class="mark"><i></i><i></i><i></i></span>Stillwater</div><nav><button class="navlink selected" id="navhome"><i class="ico">&#xe80f;</i>Home</button><button class="navlink" id="navnotes"><i class="ico">&#xe8a5;</i>My notes</button><button class="navlink" id="navcal"><i class="ico">&#xe787;</i>Calendar</button></nav><div class="navfoot"><b class="led"></b>Local workspace</div></aside>
<main><div class="top"><strong>Workspace</strong><span>/</span><span id="crumb">Home</span><div class="actions"><button class="primary" data-new>＋ New note</button></div></div>
<div class="wrap"><div id="home"><div class="mast"><div><div class="eyebrow">Wednesday · November 18</div><h1 id="page-title">Your workspace</h1></div><button class="primary folio-only" data-new>＋ New note</button></div>
<div class="hero"><canvas id="art"></canvas><span class="eyebrow">Up next &nbsp; / &nbsp; 10:00 AM</span><h3>Product design critique</h3><div class="meta">Maya Chen &nbsp;·&nbsp; Oliver Park &nbsp;·&nbsp; 45 min</div><button class="open" id="event-open">Open meeting ↗</button></div>
<div class="columns"><section class="library"><div class="sectionhead"><h2>Recent notes</h2><span class="caption">Last opened</span></div><div id="rows"></div></section><section class="schedule"><div class="sectionhead"><h2>On the calendar</h2><i class="ico">&#xe787;</i></div><div id="events"></div></section></div>
<button class="ask" id="ask"><i class="ico">&#xe721;</i><span>Search meeting notes</span><span>↵</span></button><input hidden id="query" aria-label="Filter meeting notes" placeholder="Search titles or participants">
</div><div class="paper" id="note" hidden><button class="navlink" id="back">← &nbsp; Home</button><header><div class="eyebrow">Meeting note</div><h1 id="ntitle"></h1><div class="meta" id="nmeta"></div></header><article id="nbody"></article><div class="panel" hidden id="transcript"></div><div class="dock"><b class="led"></b><span id="docklabel">Recording finished</span><button id="expand" class="small">Show transcript</button></div></div></div></main></div>
<footer class="preview"><span>Design preview</span><label>Direction <select id="theme"><option value="signal">A · Signal</option><option value="folio">B · Folio</option></select></label><label>Screen <select id="screen"><option value="home">Home</option><option value="note">Meeting note</option></select></label></footer>
<script>
const $=id=>document.getElementById(id), notes=[['Release planning','Product team','Yesterday'],['Research interviews','Avery Kim · Sam Lee','Mon'],['Engineering weekly','Maya Chen · Oliver Park','Fri']],events=[['1:30 PM','Research readout','Today'],['9:00 AM','Release planning','Tomorrow']];
function note(title='Product design critique'){const fresh=title==='New note';$('home').hidden=true;$('note').hidden=false;$('screen').value='note';$('crumb').textContent='Meeting note';$('ntitle').textContent=title;$('nmeta').textContent=fresh?'Wednesday, November 18':(notes.find(n=>n[0]===title)?.[1]||'Maya Chen · Oliver Park')+'   /   November 18';$('nbody').innerHTML=fresh?'<p contenteditable="true" aria-label="Note text">Write notes…</p>':'<h2>Review scope</h2><ul><li>Keep the first release focused on the meeting editor.<ul><li>Participants wanted more space to write while recording. <sup class="cite">1</sup></li></ul></li></ul><h2>Next steps</h2><ul><li><strong>Share the revised editor</strong> with the research group on Friday. <sup class="cite">2</sup></li></ul>';$('docklabel').textContent=fresh?'Ready to record':'Recording finished';$('expand').hidden=fresh;$('transcript').hidden=true;$('expand').textContent='Show transcript';window.scrollTo(0,0)}
function home(){ $('home').hidden=false;$('note').hidden=true;$('screen').value='home';$('crumb').textContent='Home';requestAnimationFrame(draw);window.scrollTo(0,0)}
function rows(){let q=$('query').value.toLowerCase();$('rows').replaceChildren();for(const [name,people,date] of notes.filter(x=>x.join(' ').toLowerCase().includes(q))){let b=document.createElement('button');b.className='row';b.innerHTML='<span class="docicon"><i class="ico">&#xe8a5;</i></span><span><strong>'+name+'</strong><small>'+people+'</small></span><span class="time">'+date+'</span>';b.onclick=()=>note(name);$('rows').append(b)}if(!$('rows').children.length)$('rows').textContent='No matching notes.'}
for(const [time,name,day] of events){let b=document.createElement('button');b.className='event';b.innerHTML='<span class="time">'+time+'</span><span><strong>'+name+'</strong><small>'+day+'</small></span>';b.onclick=()=>note(name);$('events').append(b)}
function draw(){const c=$('art'),w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;const r=devicePixelRatio;c.width=w*r;c.height=h*r;const g=c.getContext('2d');g.scale(r,r);let folio=$('theme').value==='folio';g.save();g.beginPath();g.rect(w*.42,0,w*.58,h);g.clip();let stroke=g.createLinearGradient(w*.42,0,w,0);stroke.addColorStop(0,'transparent');stroke.addColorStop(.45,folio?'#dab2d0aa':'#aa8bfa99');stroke.addColorStop(1,folio?'#ffd9b6bb':'#c1b1ffaa');g.strokeStyle=stroke;g.lineWidth=folio?1.15:1;
if(folio){for(let i=0;i<78;i++){g.beginPath();for(let j=0;j<=120;j++){let t=j/120,x=w*(.40+t*.72),y=h*(.18+i*.011+.29*Math.sin(5.5*t+i*.019)+.18*Math.cos(9*t-i*.023));if(!j)g.moveTo(x,y);else g.lineTo(x,y)}g.stroke()}}
else{for(let i=0;i<56;i++){g.beginPath();for(let j=0;j<=130;j++){let t=j/130,x=w*(.4+t*.62),y=h*(.97-.74*Math.exp(-Math.pow((t-.52-i*.004)/.185,2))+.027*Math.sin(15*t+i*.07))-i*.94;if(!j)g.moveTo(x,y);else g.lineTo(x,y)}g.stroke()}}g.restore()}
function theme(v){document.body.dataset.theme=v;$('theme').value=v;$('page-title').textContent=v==='folio'?'Meeting journal':'Your workspace';requestAnimationFrame(draw)}
$('theme').onchange=e=>theme(e.target.value);$('screen').onchange=e=>e.target.value==='home'?home():note();$('navhome').onclick=$('back').onclick=home;$('navnotes').onclick=()=>{home();document.querySelector('.library').scrollIntoView({block:'center'});$('ask').click()};$('navcal').onclick=()=>{home();document.querySelector('.schedule').scrollIntoView({block:'center'})};$('event-open').onclick=()=>note();document.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>note('New note'));$('expand').onclick=()=>{$('transcript').hidden=!$('transcript').hidden;$('expand').textContent=$('transcript').hidden?'Show transcript':'Close transcript';$('transcript').innerHTML='<span class="time">03:21</span> We need more room to write during a recording.<br><span class="time">08:10</span> I’ll send the revised editor to the research group on Friday.'};$('ask').onclick=()=>{$('query').hidden=false;$('query').style.cssText='width:100%;padding:12px;background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius)';$('query').focus()};$('query').oninput=rows;const params=new URLSearchParams(location.search);theme(params.get('theme')==='folio'?'folio':'signal');rows();if(params.get('screen')==='note')note();addEventListener('resize',draw);
</script></body></html>
