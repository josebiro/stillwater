.capture-widget{position:fixed;z-index:3;left:max(4vw,calc((100vw - 790px)/2));bottom:calc(var(--review-height,54px) + 16px);max-width:92vw}
.capture-widget.expanded{width:min(620px,92vw);background:var(--surface);border:1px solid #59485c;border-radius:16px;box-shadow:0 14px 48px #0007;overflow:hidden}
.capture-strip{display:inline-flex;align-items:center;gap:1px;padding:4px;border:1px solid #59485c;border-radius:22px;background:var(--surface);box-shadow:0 3px 12px #0004}
.expanded .capture-strip{display:flex;border:0;border-top:1px solid var(--border);border-radius:0;box-shadow:none;padding:7px 12px}
.capture-strip button,.panel-head button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:32px;min-width:32px;border-radius:16px;color:var(--ink);padding:5px 9px}
.capture-strip button:hover,.panel-head button:hover{background:var(--subtle)}.capture-strip .transport{color:var(--accent)}.capture-strip .finish{margin-left:auto;color:var(--muted)}
.meter{display:inline-flex;align-items:center;gap:2px;height:17px}.meter i{width:3px;height:7px;background:var(--muted);border-radius:2px}.meter i:nth-child(2){height:15px}.meter i:nth-child(3){height:10px}.recording .meter i{background:var(--accent);animation:meter .75s ease-in-out infinite alternate}.meter i:nth-child(2){animation-delay:-.6s}.meter i:nth-child(3){animation-delay:-.3s}@keyframes meter{to{transform:scaleY(.4)}}@media(prefers-reduced-motion:reduce){.meter i{animation:none!important}}
.chevron{width:7px;height:7px;border:solid var(--muted);border-width:1.5px 1.5px 0 0;transform:rotate(-45deg)}.expanded .chevron{transform:rotate(135deg)}

</style></head><body data-theme="folio" class="compact"><div class="shell"><aside><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Stillwater</div><nav aria-label="Workspace"><button class="navlink" data-screen="home">Home</button><button class="navlink" data-screen="library">My notes</button><button class="navlink" data-screen="calendar">Calendar</button><button class="navlink" data-screen="settings">Settings</button></nav><div class="navfoot"><b class="led"></b>Local workspace</div></aside><main class="wrap" id="view"></main></div>
<footer class="preview" aria-label="Design review"><strong>Folio review</strong><label>Screen <select id="screen"></select></label><label>Density <select id="density"><option>Editorial</option><option selected>Compact</option></select></label></footer>
<script>
const view=document.querySelector('#view'), screen=document.querySelector('#screen'), density=document.querySelector('#density');
const screens={home:'Home',empty:'First run',library:'Note library',calendar:'Calendar',editor:'Writing & capture',live:'Live transcript',enhanced:'Enhanced notes',ask:'Ask your notes',settings:'Settings',tray:'Windows tray',system:'Design system'};
for(const [key,label] of Object.entries(screens))screen.add(new Option(label,key));
const notes=[['Release planning','Product team','Yesterday'],['Research interviews','Avery Kim · Sam Lee','Mon'],['Engineering weekly','Maya Chen · Oliver Park','Fri']];
const events=[['10:00 AM','Product design critique','Maya Chen · Oliver Park'],['1:30 PM','Research readout','Research team'],['Tomorrow','Release planning','Product team']];
const quotes=['Keep the first release focused on the editor. People wanted more room to write during a recording.','I’ll send the revised editor to the research group on Friday.'];
const times=['03:21','08:10'];
const ui={page:'home',title:'Product design critique',manual:'Give people more space to write during recording.',record:'Ready to record',query:'',provider:'Local',model:{Local:'Local model',OpenAI:'Configured model',Anthropic:'Configured model'},asked:false,stored:false};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(t,a,c='small')=>'<button class="'+c+'" data-action="'+a+'">'+t+'</button>';
const mast=(label,title,action='')=>'<div class="mast"><div><div class="eyebrow">'+label+'</div><h1>'+title+'</h1></div>'+action+'</div>';
const rows=()=>notes.filter(n=>n.join(' ').toLowerCase().includes(ui.query.toLowerCase())).map(([n,p,d])=>'<button class="row" data-note="'+n+'"><span class="docicon">≡</span><span><strong>'+n+'</strong><small>'+p+'</small></span><span class="time">'+d+'</span></button>').join('')||'<p class="line hint">No matching notes.</p>';
const eventRows=()=>events.map(([t,n,p])=>'<button class="event" data-event="'+n+'"><span class="time">'+t+'</span><span><strong>'+n+'</strong><small>'+p+'</small></span></button>').join('');
function journal(empty){return mast('Wednesday · November 18','Meeting journal',btn('＋ New note','new','primary'))+'<section class="hero"><canvas id="art" aria-hidden="true"></canvas><div class="eyebrow">Up next'+(empty?'':' &nbsp; / &nbsp; 10:00 AM')+'</div><h3>'+(empty?'Your calendar is clear':'Product design critique')+'</h3><div class="meta">'+(empty?'Connect a calendar to see upcoming meetings.':'Maya Chen · Oliver Park · 45 min')+'</div>'+btn(empty?'Calendar settings':'Open meeting ↗',empty?'settings':'event','open')+'</section><div class="columns"><section class="schedule"><div class="sectionhead"><h2>On the calendar</h2></div>'+(empty?'<p class="line hint">No scheduled events.</p>':eventRows())+'</section><section class="library"><div class="sectionhead"><h2>Recent notes</h2><span class="caption">Last opened</span></div>'+(empty?'<p class="line hint">Your first meeting note will appear here.</p>':rows())+btn('Ask across your meetings <span>↗</span>','ask','ask')+'</section></div>'}
function transcript(){
  const hasAudio=ui.record!=='Ready to record';
  return `<section class="capture-panel" id="transcript-panel" aria-label="Transcript">
    <div class="panel-head"><h2>Transcript</h2>
      <button data-action="search-lines" aria-label="Search transcript">Search</button>
      <button data-action="copy" ${hasAudio?'':'disabled'}>Copy</button>
      <button data-action="flag" ${hasAudio?'':'disabled'}>Flag</button>
      <button data-action="collapse" aria-label="Close transcript">−</button></div>
    <input hidden id="find" type="search" aria-label="Search transcript" placeholder="Find in transcript">
    ${ui.record==='Paused'?'<span class="pause-label">Transcript paused</span>':''}
    <div id="lines">${hasAudio?lines(''):'<p class="line hint">Start recording to see the transcript.</p>'}</div>
    <p role="status" id="feedback"></p></section>`;
}
function widget(expanded){
  const state=ui.record, active=state==='Recording', paused=state==='Paused';
  const label=active?'Pause':paused?'Resume':'Record';
  const transport=state==='Finished'?'':`<button class="transport" data-action="${active||paused?'toggle':'record'}" aria-label="${label} recording" title="${label} recording"><span aria-hidden="true">${active?'Ⅱ':'▶'}</span>${expanded?label:''}</button>`;
  return `<div class="capture-widget ${expanded?'expanded':''} ${active?'recording':''}">
    ${expanded?transcript():''}
    <div class="capture-strip" role="group" aria-label="Recording controls">
      <button data-action="${expanded?'collapse':'expand'}" aria-expanded="${expanded}" ${expanded?'aria-controls="transcript-panel"':''} aria-label="${state}. ${expanded?'Hide':'Show'} transcript" title="${state} · Transcript">
        <span class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="chevron"></span></button>
      ${transport}
      ${expanded&&(active||paused)?'<button class="finish" data-action="finish">Finish recording</button>':''}
    </div></div>`;
}
function lines(q){return quotes.map((s,i)=>s.toLowerCase().includes(q.toLowerCase())?'<div class="line" id="quote'+i+'"><span class="time">'+times[i]+' · '+['Maya','Oliver'][i]+'</span><p>'+s+'</p></div>':'').join('')||'<p>No matches.</p>'}
function documentPage(page){let enhanced=page==='enhanced', live=page==='live';return '<div class="paper"><header><div class="eyebrow">Meeting note</div><h1>'+esc(ui.title)+'</h1><div class="meta">November 18 &nbsp; / &nbsp; Maya Chen · Oliver Park</div></header><div class="draft-grid"><article>'+(enhanced?'<div class="toolbar"><span class="label">Enhanced notes</span>'+btn('Edit notes','editor')+'</div><h2>Editor scope</h2><ul><li>Keep the first release focused on the meeting editor. '+btn('1','cite0','cite')+'<ul><li>'+esc(ui.manual)+'</li></ul></li></ul><h2>Next steps</h2><ul><li><strong>Oliver to share the revised editor on Friday</strong> with the research group. '+btn('2','cite1','cite')+'</li></ul>':'<div class="toolbar"><label for="writing" class="label">Meeting notes</label><small class="hint" id="save">Saved locally · preview</small></div><textarea class="writing" id="writing" placeholder="Write notes…">'+esc(ui.manual)+'</textarea>'+(ui.record==='Finished'?btn('Enhance notes','enhanced','primary'):''))+'</article></div>'+widget(live)+'</div>'}
function settings(){return '<section class="settings">'+mast('Workspace','Settings')+'<div class="spec"><h2>Meeting notes and questions</h2><label class="field">Provider<select id="provider">'+['Local','OpenAI','Anthropic'].map(v=>'<option '+(ui.provider===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label><p class="hint">'+(ui.provider==='Local'?'Notes and questions use a model running on your machine.':'Enhancing notes or asking a question sends the relevant meeting text to this provider.')+'</p>'+(ui.provider==='Local'?'':'<label class="field">API key<input disabled placeholder="••••••••   Demo credential field"></label>')+'<label class="field">Model<input id="model" value="'+esc(ui.model[ui.provider])+'"></label></div><div class="spec"><h2>Speech and recording</h2><p>English · Moonshine &nbsp; / &nbsp; Multilingual · Whisper</p></div><div class="spec"><h2>Calendar</h2><p class="hint">Google Calendar · '+(ui.stored?'Disconnected':'Connected · Updated 9:42 AM')+'</p>'+btn(ui.stored?'Connect sample calendar':'Disconnect sample calendar','connect')+'</div></section>'}
function system(){let colors=[['Canvas','#110e15'],['Surface','#211924'],['Raised control','#302332'],['Hairline','#3b303f'],['Ink','#fff4ed'],['Secondary text','#c0b0bc'],['Orchid focus','#e1a8ee'],['Primary action','#e6bfda'],['Apricot metadata','#e7b48e'],['Success','#a9d7c0'],['Recording','#f4a7bc'],['Error','#ffb4ad']];return mast('Stillwater / Visual foundations','Folio design system')+'<div class="system-rail">'+['Identity','Palette','Type','Geometry','Controls','States'].map(x=>'<a href="#'+x+'">'+x+'</a>').join('')+'</div><section class="spec" id="Identity"><div class="split"><div><h2>Identity</h2><p class="hint">The three waterlines and italic wordmark anchor the navigation. The orchid-to-rose ribbon marks the next meeting.</p></div><div class="brand"><span class="mark"><i></i><i></i><i></i></span>Stillwater</div></div></section><section class="spec" id="Palette"><h2>Palette</h2><div class="grid">'+colors.map(([n,c])=>'<div><div class="swatch" style="background:'+c+'"></div>'+n+' <code>'+c+'</code></div>').join('')+'</div></section><section class="spec" id="Type"><h2>Type</h2><h3>Meeting journal</h3><p>Georgia · Display 48–80 px, section 26 px, list title 21 px</p><p class="line">Segoe UI · Body 14–17 px / 1.45–1.75 line height</p><span class="label">Consolas · Metadata 11–12 px</span></section><section class="spec" id="Geometry"><h2>Geometry</h2><p>4, 8, 12, 16, 24 and 32 px spacing. Use 1 px rules between notes, 3 px corners on controls and a 790 px reading column.</p></section><section class="spec" id="Controls"><h2>Controls</h2><div class="toolbar">'+btn('New note','new','primary')+btn('View library','library')+'<button disabled class="small">Unavailable</button><span class="cite">1</span><label class="field">Search<input placeholder="Find a note"></label></div></section><section class="spec" id="States"><h2>Feedback and focus</h2><div class="stack"><span class="success">✓ Saved locally</span><span class="live">● Recording</span><span class="time">Ⅱ Paused</span><span class="error">Couldn’t reach the model. Try again.</span><button class="small" style="outline:2px solid var(--accent);outline-offset:3px;justify-self:start" data-action="editor">Keyboard focus</button></div></section>'}
function draw(){const c=document.querySelector('#art');if(!c)return;const w=c.clientWidth,h=c.clientHeight,r=devicePixelRatio;c.width=w*r;c.height=h*r;const g=c.getContext('2d');g.scale(r,r);const ink=g.createLinearGradient(w*.42,0,w,0);ink.addColorStop(0,'transparent');ink.addColorStop(.45,'#dab2d0aa');ink.addColorStop(1,'#ffd9b6bb');g.strokeStyle=ink;g.lineWidth=1;for(let i=0;i<78;i++){g.beginPath();for(let j=0;j<=120;j++){const t=j/120,x=w*(.4+t*.72),y=h*(.18+i*.011+.29*Math.sin(5.5*t+i*.019)+.18*Math.cos(9*t-i*.023));if(j)g.lineTo(x,y);else g.moveTo(x,y)}g.stroke()}}
function go(page){ui.page=page;screen.value=page;document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-current',b.dataset.screen===page?'page':'false'));let content;
switch(page){
case 'home':case 'empty':content=journal(page==='empty');break;
case 'editor':case 'live':case 'enhanced':content=documentPage(page);break;
case 'system':content=system();break;
case 'settings':content=settings();break;
case 'calendar':content=mast('November 2026','Calendar',btn('Calendar settings','settings'))+'<div class="split"><section><h2>This week</h2>'+eventRows()+'</section><div class="side"><span class="label">Selected calendar</span><h2>Work</h2><p class="hint">Google Calendar · Updated 9:42 AM</p></div></div>';break;
case 'library':content=mast('Your workspace','My notes',btn('＋ New note','new','primary'))+'<div class="split"><div class="stack"><label class="field">Search meetings<input type="search" id="search" placeholder="Title or participant" value="'+esc(ui.query)+'"></label><div id="results">'+rows()+'</div></div><div class="side"><h2>Contexts</h2><div class="line">Product team</div><div class="line">Research</div></div></div>';break;
case 'ask':content=mast('Meeting library','Ask your notes')+'<div class="paper sheet"><label class="field">Question<input id="question" readonly value="Who is sharing the revised editor?"></label><p>'+btn('Ask sample question','answer','primary')+'</p>'+(ui.asked?'<div class="line"><p>Oliver will share the revised editor with the research group on Friday.</p>'+btn('Product design critique · 08:10','cite1','cite')+'</div>':'')+'</div>';break;
case 'tray':content=mast('Windows / Notification area','Tray menu')+'<div class="split"><div class="menu" aria-label="Tray menu specimen">'+['Open Stillwater','New note','Settings','Stillwater · Version information','Check for updates','Troubleshooting ›','Quit','Restart Stillwater','Quit completely'].map(n=>'<div>'+n+'</div>').join('')+'</div><div class="side"><h2>Troubleshooting</h2><p class="line">Record performance trace (10 seconds)</p><p class="hint">Windows draws the native menu. This specimen shows its hierarchy and actions.</p></div></div>';break;
}view.innerHTML=content;requestAnimationFrame(draw);window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.screen)return go(b.dataset.screen);if(b.dataset.note){ui.title=b.dataset.note;ui.record='Finished';return go('enhanced')}if(b.dataset.event){ui.title=b.dataset.event;return go('editor')}let a=b.dataset.action;if(!a)return;if(a==='new'){ui.title='New note';ui.manual='';ui.record='Recording';return go('editor')}if(a==='event'){ui.title='Product design critique';return go('editor')}if(a==='search-lines'){const f=document.querySelector('#find');f.hidden=false;f.focus();return}
if(a==='expand'){ui.returnPage=ui.page;go('live');view.querySelector('.capture-strip button').focus();return}
if(a==='collapse'){go(ui.returnPage||'editor');view.querySelector('.capture-strip button').focus();return}
if(a==='record'){ui.record='Recording';go(ui.page);view.querySelector('.transport').focus();return}if(a==='toggle'){ui.record=ui.record==='Paused'?'Recording':'Paused';go(ui.page);view.querySelector('.transport').focus();return}if(a==='finish'){ui.record='Finished';return go('editor')}if(a.startsWith('cite')){ui.returnPage='enhanced';ui.record='Finished';go('live');const el=document.querySelector('#quote'+a.slice(-1));el.scrollIntoView({block:'center'});el.style.outline='1px solid var(--accent)';return}if(a==='copy'){navigator.clipboard?.writeText(quotes.join('\n')).then(()=>document.querySelector('#feedback').textContent='Copied transcript.').catch(()=>document.querySelector('#feedback').textContent='Clipboard unavailable.');return}if(a==='flag'){document.querySelector('#feedback').textContent='Flagged for review · preview';return}if(a==='connect'){ui.stored=!ui.stored;return go('settings')}if(a==='answer'){ui.asked=true;return go('ask')}if(screens[a])go(a)});
view.addEventListener('input',e=>{if(e.target.id==='writing')ui.manual=e.target.value;if(e.target.id==='search'){ui.query=e.target.value;document.querySelector('#results').innerHTML=rows()}if(e.target.id==='find'&&ui.record!=='Ready to record')document.querySelector('#lines').innerHTML=lines(e.target.value);if(e.target.id==='model')ui.model[ui.provider]=e.target.value});
view.addEventListener('change',e=>{if(e.target.id==='provider'){ui.provider=e.target.value;go('settings')}});
screen.onchange=()=>{if(screen.value==='live'){ui.returnPage='editor';ui.record='Recording'}if(screen.value==='enhanced')ui.record='Finished';go(screen.value)};
density.onchange=()=>{document.body.classList.toggle('compact',density.selectedIndex===1);requestAnimationFrame(draw)};
new ResizeObserver(([entry])=>document.body.style.setProperty('--review-height',entry.target.offsetHeight+'px')).observe(document.querySelector('.preview'));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.page==='live'){document.querySelector('[data-action=collapse]').click()}});
const first=new URLSearchParams(location.search).get('screen');if(first==='live')ui.record='Recording';if(first==='enhanced')ui.record='Finished';go(Object.hasOwn(screens,first)?first:'home');addEventListener('resize',draw);
</script></body></html>
